name: Build downloads
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . -r requirements-build.txt
      - run: python -m unittest discover -s tests -t . -q
      - uses: actions/cache@v4
        id: ffmpeg-cache
        with:
          path: build/minimal-ffmpeg
          key: ffmpeg-win64-${{ hashFiles('scripts/windows-tools.json', 'scripts/build_ffmpeg.sh') }}
      - name: Prepare pinned FFmpeg source
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: python -c "from scripts.build_release import prepare_ffmpeg_source; prepare_ffmpeg_source()"
      - uses: msys2/setup-msys2@v2
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        with:
          msystem: MINGW64
          path-type: inherit
          update: true
          install: >-
            make diffutils
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-nasm
            mingw-w64-x86_64-lame
      - name: Build only required FFmpeg components
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: bash scripts/build_ffmpeg.sh
      - run: python scripts/build_release.py --windows --setup --iscc "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
      - name: Check real engine paths with the minimal media tools
        run: python tests/media_smoke.py --ffmpeg build/minimal-ffmpeg/ffmpeg.exe --ffprobe build/minimal-ffmpeg/ffprobe.exe
      - name: Check packaged dependencies without system tools
        shell: pwsh
        run: |
          $savedPath = $env:PATH
          $report = Join-Path $env:RUNNER_TEMP 'ytduo-dependencies.json'
          try {
            $version = python -c "from ytduo import __version__; print(__version__)"
            $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
            $env:YTDUO_SELF_TEST_REPORT = $report
            $process = Start-Process -FilePath (Resolve-Path "Releases/windows/YT-Duo-$version-Portable.exe") -WindowStyle Hidden -PassThru -Wait
            if ($process.ExitCode -ne 0) { throw 'Packaged dependency check failed' }
            Get-Content $report
            $data = Get-Content $report -Raw | ConvertFrom-Json
            if ($data.split_downloads.interval[0] -ne 60 -or $data.split_downloads.interval[1] -ne 90) { throw 'Packaged split module missing or broken' }
          } finally {
            $env:PATH = $savedPath
            Remove-Item Env:YTDUO_SELF_TEST_REPORT -ErrorAction SilentlyContinue
          }
      - name: Check packaged replacement and restart
        shell: pwsh
        run: |
          $version = python -c "from ytduo import __version__; print(__version__)"
          $folder = Join-Path $env:RUNNER_TEMP 'ytduo-update-roundtrip'
          New-Item -ItemType Directory -Path $folder -Force | Out-Null
          $updateFolder = Join-Path ([IO.Path]::GetTempPath()) ("ytduo-update-" + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $updateFolder | Out-Null
          $source = Join-Path $updateFolder "YT-Duo-$version-Portable.exe"
          $target = Join-Path $folder 'YT-Duo.exe'
          $report = Join-Path $folder 'restarted.json'
          Copy-Item "Releases/windows/YT-Duo-$version-Portable.exe" $source
          $expectedHash = (Get-FileHash $source).Hash
          Set-Content -LiteralPath $target -Value 'old payload'
          try {
            $env:YTDUO_SELF_TEST_REPORT = $report
            $process = Start-Process -FilePath $source -ArgumentList @('--apply-update', "`"$target`"", '0', '0') -WindowStyle Hidden -PassThru -Wait
            if ($process.ExitCode -ne 0) { throw 'Update helper failed' }
            $deadline = (Get-Date).AddSeconds(60)
            while (-not (Test-Path $report) -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 200 }
            if (-not (Test-Path $report)) { throw 'Updated app did not restart' }
            $data = Get-Content $report -Raw | ConvertFrom-Json
            if ($data.version -ne $version -or ($data.dependencies | Where-Object { -not $_[1] })) { throw 'Restarted app dependency check failed' }
            if ($expectedHash -ne (Get-FileHash $target).Hash) { throw 'Updated EXE differs from verified payload' }
            if (Test-Path "$target.previous") { throw 'Update backup was not cleared' }
            if (Test-Path $updateFolder) { throw 'Temporary update stage was not removed' }
            Get-Content $report
          } finally {
            Remove-Item Env:YTDUO_SELF_TEST_REPORT -ErrorAction SilentlyContinue
          }
      - name: Check source ZIP
        shell: pwsh
        run: |
          Expand-Archive Releases/YT-Duo-*-source.zip -DestinationPath "$env:RUNNER_TEMP/ytduo-source"
          python -m venv --system-site-packages "$env:RUNNER_TEMP/ytduo-source-env"
          $python = "$env:RUNNER_TEMP/ytduo-source-env/Scripts/python.exe"
          & $python -m pip install --no-deps --no-build-isolation "$env:RUNNER_TEMP/ytduo-source/YT-Duo"
          if ($LASTEXITCODE -ne 0) { throw 'Source install failed' }
          Push-Location $env:RUNNER_TEMP
          & $python -m ytduo --version
          if ($LASTEXITCODE -ne 0) { throw 'Source entry point failed' }
          Pop-Location
      - uses: actions/upload-artifact@v4
        with:
          name: YT-Duo-downloads
          path: Releases/*
      - name: Stage verified downloads in a draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = python -c "from ytduo import __version__; print(__version__)"
          $tag = "v$version"
          $existing = gh release list --repo $env:GITHUB_REPOSITORY --limit 100 --json tagName,isDraft | ConvertFrom-Json | Where-Object tagName -eq $tag
          if ($existing -and -not $existing.isDraft) { throw 'Refusing to overwrite a published release' }
          if (-not $existing) {
            $notes = @"
          Windows portable and Setup now bundle Python/Tk, yt-dlp with YouTube JS helpers, FFmpeg, FFprobe and Deno. No separate dependency installation is required for the Windows downloads.

          Source and Unix users can run python -m ytduo --check-dependencies and follow the setup guide in Releases/README.md.

          The build verifies pinned dependency hashes, runs a media conversion/probe smoke check, and tests the packaged dependency report with a system-only PATH. Downloads include a buildable source ZIP, licenses, third-party notices and SHA-256 checksums.

          Windows builds remain unsigned. Linux/macOS downloads are Python launchers; native macOS execution and live YouTube downloads are not established by the offline tests.
          "@
            $notesPath = Join-Path $env:RUNNER_TEMP 'ytduo-release-notes.md'
            Set-Content -LiteralPath $notesPath -Value $notes -Encoding utf8
            gh release create $tag --repo $env:GITHUB_REPOSITORY --draft --target $env:GITHUB_SHA --title "YT-Duo $version" --notes-file $notesPath
            if ($LASTEXITCODE -ne 0) { throw 'Could not create draft release' }
          }
          $files = @(Get-ChildItem Releases/windows/*.exe, Releases/linux/*.sh, Releases/macos/*.command, Releases/*-source.zip -File | ForEach-Object FullName)
          $files += @('Releases/LICENSE', 'Releases/THIRD_PARTY_NOTICES.md', 'Releases/SHA256SUMS.txt')
          gh release upload $tag @files --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload draft release assets' }
