name: Offline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -t . -q
      - if: runner.os == 'Linux'
        run: xvfb-run -a python -m unittest discover -s tests -t . -q
