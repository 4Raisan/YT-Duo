name: Offline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -t . -q
      - name: macOS engine and CLI checks (headless runner)
        if: runner.os == 'macOS'
        run: |
          python - <<'PY'
          import faulthandler
          import unittest
          from tests.test_gui import GuiTestCase
          GuiTestCase.__unittest_skip__ = True
          GuiTestCase.__unittest_skip_why__ = 'Native Tk GUI is not validated by the headless macOS runner'
          faulthandler.dump_traceback_later(90, repeat=True)
          suite = unittest.defaultTestLoader.discover('tests', top_level_dir='.')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(not result.wasSuccessful())
          PY
      - if: runner.os == 'Linux'
        run: xvfb-run -a python -m unittest discover -s tests -t . -q
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - if: runner.os == 'macOS'
        run: command -v ffmpeg || brew install ffmpeg
      - if: runner.os != 'Windows'
        run: python tests/media_smoke.py
      - if: runner.os != 'Windows'
        run: python tests/split_smoke.py
      - run: python -m ytduo --version
      - run: python -m compileall -q src scripts
