[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "yt-duo"
version = "4.6.5"
description = "Download YouTube videos in the best available quality."
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["yt-dlp[default]>=2026.8.19", "certifi>=2024.2.2"]

[project.scripts]
yt-duo = "ytduo.cli:main"

[project.gui-scripts]
yt-duo-gui = "ytduo.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ytduo = ["assets/*.png", "assets/*.ico"]
